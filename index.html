<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Günlük Bakım Takibi</title>
<meta name="description" content="On Field Daily Maintenance Report — günlük bakım takibi, geçmiş kayıtlar, 2 gün üst üste bakım uyarısı">
<style>
/* ============================================================
   Günlük Bakım — Daily Maintenance Tracker
   ============================================================ */
:root {
  --bg: #f2f4f8;
  --panel: #ffffff;
  --ink: #16202e;
  --muted: #64748b;
  --line: #e2e8f0;
  --line2: #cbd5e1;
  --brand: #1d4ed8;
  --brand2: #3b82f6;
  --brand-ink: #ffffff;
  --ok: #16a34a;
  --ok-bg: #dcfce7;
  --warn: #d97706;
  --warn-bg: #fef3c7;
  --danger: #dc2626;
  --danger-bg: #fee2e2;
  --neutral-bg: #eef2f7;
  --radius: 10px;
  --shadow: 0 1px 2px rgba(15, 23, 42, .06), 0 4px 16px rgba(15, 23, 42, .06);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.45;
}

h1, h2, h3 { margin: 0; font-weight: 700; }
button { font: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  gap: 18px;
  flex-wrap: wrap;
  padding: 10px 18px;
  background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
  color: #f8fafc;
  box-shadow: 0 2px 10px rgba(2, 6, 23, .35);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo {
  display: grid; place-items: center;
  width: 38px; height: 38px;
  border-radius: 9px;
  background: var(--brand2);
  font-size: 20px;
}
.brand h1 { font-size: 16px; letter-spacing: .2px; }
.brand small { display: block; color: #94a3b8; font-size: 11px; font-weight: 400; }

.nav { display: flex; gap: 6px; flex-wrap: wrap; }
.nav button {
  border: 0;
  background: transparent;
  color: #cbd5e1;
  padding: 8px 13px;
  border-radius: 8px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 7px;
}
.nav button:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.nav button.active { background: var(--brand); color: #fff; }
.nav .badge {
  background: var(--danger);
  color: #fff;
  border-radius: 999px;
  font-size: 11px;
  padding: 1px 7px;
  min-width: 20px;
  text-align: center;
}

.top-actions { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.lang-switch {
  display: flex;
  background: rgba(255, 255, 255, .1);
  border-radius: 8px;
  padding: 3px;
  gap: 3px;
}
.lang-switch button {
  border: 0;
  background: transparent;
  color: #cbd5e1;
  padding: 5px 11px;
  border-radius: 6px;
  font-weight: 700;
  font-size: 12px;
  letter-spacing: .5px;
}
.lang-switch button.active { background: #fff; color: #0f172a; }

/* ---------- Layout ---------- */
main { padding: 18px; max-width: 1700px; margin: 0 auto; }
.page-title { font-size: 20px; margin-bottom: 4px; }
.page-sub { color: var(--muted); margin: 0 0 16px; font-size: 13px; }

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 16px;
}
.card h2 { font-size: 15px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h2 .count { color: var(--muted); font-weight: 600; font-size: 13px; }

.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.grow { flex: 1 1 220px; }
.spacer { flex: 1 1 auto; }

/* ---------- KPI ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 16px;
  position: relative;
  overflow: hidden;
}
.kpi .k-label { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.kpi .k-value { font-size: 26px; font-weight: 800; margin-top: 2px; }
.kpi .k-note { color: var(--muted); font-size: 12px; }
.kpi.ok { border-left: 4px solid var(--ok); }
.kpi.warn { border-left: 4px solid var(--warn); }
.kpi.danger { border-left: 4px solid var(--danger); }
.kpi.info { border-left: 4px solid var(--brand2); }
.kpi.danger .k-value { color: var(--danger); }
.kpi.ok .k-value { color: var(--ok); }

/* progress */
.progress { height: 8px; background: var(--neutral-bg); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand2), var(--ok)); transition: width .25s; }

/* ---------- Fields ---------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
.input, select.input, textarea.input {
  border: 1px solid var(--line2);
  border-radius: 8px;
  padding: 8px 10px;
  background: #fff;
  outline: none;
  min-width: 0;
}
.input:focus { border-color: var(--brand2); box-shadow: 0 0 0 3px rgba(59, 130, 246, .18); }
textarea.input { resize: vertical; min-height: 60px; }

/* ---------- Buttons ---------- */
.btn {
  border: 1px solid var(--line2);
  background: #fff;
  color: var(--ink);
  border-radius: 8px;
  padding: 8px 14px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn:hover { background: #f8fafc; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: #1e40af; }
.btn.danger { background: var(--danger); border-color: var(--danger); color: #fff; }
.btn.danger:hover { background: #b91c1c; }
.btn.ghost-danger { color: var(--danger); border-color: #fca5a5; background: #fff; }
.btn.ghost-danger:hover { background: var(--danger-bg); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 999px;
  padding: 3px 10px;
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.danger { background: var(--danger-bg); color: var(--danger); }
.chip.neutral { background: var(--neutral-bg); color: var(--muted); }
.chip.oil { background: #e0f2fe; color: #0369a1; font-weight: 600; }

.saved-note { color: var(--ok); font-size: 12.5px; font-weight: 600; opacity: 0; transition: opacity .3s; }
.saved-note.show { opacity: 1; }

/* ---------- Alerts ---------- */
.alerts { border-color: #fca5a5; background: #fff7f7; }
.alerts h2 { color: var(--danger); }
.alert-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
.alert-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #fff;
  border: 1px solid #fecaca;
  border-radius: 8px;
  padding: 8px 10px;
  cursor: pointer;
}
.alert-item:hover { border-color: var(--danger); background: var(--danger-bg); }
.alert-item .a-no { font-weight: 800; color: var(--danger); min-width: 86px; }
.alert-item .a-type { color: var(--muted); font-size: 12.5px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert-item .a-days { font-weight: 700; font-size: 12px; color: var(--danger); white-space: nowrap; }
.alert-item .a-last { font-size: 11.5px; color: var(--muted); white-space: nowrap; }

/* ---------- Table ---------- */
.table-wrap {
  overflow: auto;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: #fff;
  max-height: 72vh;
}
table.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1950px; }
table.grid th, table.grid td {
  border-bottom: 1px solid var(--line);
  padding: 7px 8px;
  vertical-align: middle;
  background: #fff;
}
table.grid thead th {
  position: sticky;
  top: 0;
  z-index: 3;
  background: #f8fafc;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .3px;
  color: #475569;
  text-align: left;
  border-bottom: 2px solid var(--line2);
  white-space: nowrap;
}
table.grid tbody tr:hover td { background: #f8fbff; }
table.grid tbody tr.visited td { background: #f6fef9; }
table.grid tbody tr.visited:hover td { background: #effdf5; }
table.grid td.num, table.grid th.num { text-align: center; }

/* sticky identity columns (chk / no / type / brand) */
table.grid .c-chk { position: sticky; left: 0; z-index: 2; width: 40px; min-width: 40px; text-align: center; }
table.grid .c-no  { position: sticky; left: 40px; z-index: 2; min-width: 108px; max-width: 108px; font-weight: 700; }
table.grid .c-type{ position: sticky; left: 148px; z-index: 2; min-width: 175px; max-width: 175px; border-right: 1px solid var(--line); }
table.grid .c-bm  { position: sticky; left: 323px; z-index: 2; min-width: 190px; max-width: 190px; border-right: 1px solid var(--line); }
table.grid thead .c-chk, table.grid thead .c-no, table.grid thead .c-type, table.grid thead .c-bm { z-index: 4; background: #f8fafc; }
table.grid .c-type small, table.grid .c-bm small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
table.grid .c-bm b { display: block; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

table.grid .o-col { min-width: 94px; width: 94px; text-align: center; }

/* yağ hücresi: kutucuk + litre girişi */
.oil-cell { display: inline-flex; align-items: center; gap: 4px; justify-content: center; }
.oil-qty {
  width: 48px;
  padding: 3px 4px;
  border: 1px solid var(--line2);
  border-radius: 6px;
  font-size: 12px;
  text-align: center;
  background: #fff;
  -moz-appearance: textfield;
}
.oil-qty::-webkit-outer-spin-button, .oil-qty::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.oil-qty:hover { border-color: var(--brand2); }
.oil-qty:focus { border-color: var(--brand2); outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, .18); }
.oil-qty:disabled { background: var(--neutral-bg); cursor: not-allowed; }
.oil-qty::placeholder { color: var(--muted); opacity: .7; }
table.grid .obs { min-width: 200px; max-width: 280px; }
table.grid .obs input { width: 100%; }
table.grid input[type="text"] { border: 1px solid transparent; background: transparent; border-radius: 6px; padding: 5px 6px; width: 100%; }
table.grid input[type="text"]:hover { border-color: var(--line2); }
table.grid input[type="text"]:focus { border-color: var(--brand2); background: #fff; outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, .15); }

table.grid.compact { min-width: 980px; }
table.grid.compact th, table.grid.compact td { padding: 6px 8px; }

/* checkbox */
.cb {
  appearance: none;
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border: 2px solid var(--line2);
  border-radius: 5px;
  background: #fff;
  display: inline-block;
  vertical-align: middle;
  position: relative;
  cursor: pointer;
  transition: .12s;
}
.cb:checked { background: var(--ok); border-color: var(--ok); }
.cb:checked::after {
  content: "";
  position: absolute;
  left: 5px; top: 1px;
  width: 5px; height: 10px;
  border: solid #fff;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
}
.cb.big { width: 22px; height: 22px; }
.cb:disabled { opacity: .4; }

/* ---------- Toolbar ---------- */
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
.toolbar .field { min-width: 130px; max-width: 320px; }
.toolbar .field .input { max-width: 100%; }
.toolbar .field select.input { width: 220px; }
.toolbar .check-inline { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; color: var(--muted); padding-bottom: 7px; }

.date-nav { display: flex; align-items: center; gap: 6px; }
.date-nav .btn { padding: 7px 10px; }

/* ---------- History ---------- */
.day-card { border: 1px solid var(--line); border-radius: var(--radius); background: #fff; margin-bottom: 10px; overflow: hidden; }
.day-card summary {
  list-style: none;
  cursor: pointer;
  padding: 12px 14px;
  display: flex;
  gap: 14px;
  align-items: center;
  flex-wrap: wrap;
}
.day-card summary::-webkit-details-marker { display: none; }
.day-card summary:hover { background: #f8fafc; }
.day-card .d-date { font-weight: 800; min-width: 110px; }
.day-card .d-meta { color: var(--muted); font-size: 12.5px; }
.day-card .d-caret { margin-left: auto; color: var(--muted); transition: transform .15s; }
.day-card[open] .d-caret { transform: rotate(90deg); }
.day-card .d-body { border-top: 1px solid var(--line); padding: 0; overflow-x: auto; }
.day-card .d-body table { min-width: 900px; }

.chart { display: flex; align-items: flex-end; gap: 5px; height: 130px; padding-top: 8px; }
.chart .bar { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; min-width: 0; height: 100%; }
.chart .bar i {
  display: block;
  width: 100%;
  max-width: 34px;
  background: linear-gradient(180deg, var(--brand2), var(--brand));
  border-radius: 5px 5px 0 0;
  min-height: 3px;
  transition: height .3s;
}
.chart .bar.zero i { background: var(--line); }
.chart .bar b { font-size: 10.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.chart .bar span { font-size: 11px; font-weight: 700; color: #334155; }

/* ---------- Modal ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, .55);
  display: grid;
  place-items: center;
  z-index: 100;
  padding: 18px;
}
.modal {
  background: #fff;
  border-radius: 14px;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 20px 60px rgba(2, 6, 23, .4);
  overflow: hidden;
  animation: pop .15s ease-out;
}
@keyframes pop { from { transform: scale(.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.modal .m-head { padding: 16px 18px; border-bottom: 1px solid var(--line); font-weight: 800; font-size: 15px; }
.modal .m-body { padding: 16px 18px; display: grid; gap: 12px; }
.modal .m-foot { padding: 14px 18px; background: #f8fafc; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 10px; }
.modal .err { color: var(--danger); font-size: 12.5px; font-weight: 600; min-height: 16px; }
.modal p { margin: 0; color: #334155; }

/* ---------- Toast ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%) translateY(20px);
  background: #0f172a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 999px;
  font-weight: 600;
  font-size: 13.5px;
  opacity: 0;
  pointer-events: none;
  transition: .25s;
  z-index: 200;
  box-shadow: 0 8px 30px rgba(2, 6, 23, .4);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.ok { background: #14532d; }
.toast.err { background: #7f1d1d; }

/* ---------- Empty ---------- */
.empty { text-align: center; color: var(--muted); padding: 34px 16px; }
.empty .big { font-size: 34px; display: block; margin-bottom: 6px; }

.hint { color: var(--muted); font-size: 12.5px; }
.sep { height: 1px; background: var(--line); margin: 14px 0; }

.set-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px dashed var(--line); flex-wrap: wrap; }
.set-row:last-child { border-bottom: 0; }
.set-row .s-label { font-weight: 700; }
.set-row .s-desc { color: var(--muted); font-size: 12.5px; max-width: 640px; }

.tag-row { display: flex; gap: 5px; flex-wrap: wrap; }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  main { padding: 12px; }
  .topbar { padding: 10px 12px; gap: 10px; }
  .top-actions { margin-left: 0; width: 100%; justify-content: space-between; }
  .kpi .k-value { font-size: 22px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">🔧</span>
    <div>
      <h1 id="brandTitle">Günlük Bakım Takibi</h1>
      <small id="brandSub">On Field Daily Maintenance Report</small>
    </div>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="top-actions">
    <div class="lang-switch" id="langSwitch"></div>
  </div>
</header>

<main id="main"></main>
<div id="toast" class="toast"></div>

  'MEDIUM DUTY VEHICLE / FUEL DISPENSER TRUCK - BECAME TYRE TRUCK': 'ORTA TONAJLI ARAÇ / YAKIT DAĞITIM - LASTİK DEĞİŞİM ARACI',
  'HEAVY DUTY VEHICLE / CSCV-002 COMBI SURFACE COATING VEHICLE': 'AĞIR TONAJLI ARAÇ / KOMBİ YOL KAPLAMA ARACI',
  'HEAVY DUTY VEHICLE / CSCV-001 COMBI SURFACE COATING VEHICLE': 'AĞIR TONAJLI ARAÇ / KOMBİ YOL KAPLAMA ARACI',
  'HEAVY DUTY VEHICLE / AD-002 ASPALT DISTRIBUTOR': 'AĞIR TONAJLI ARAÇ / ASFALT DAĞITICI',
  'HEAVY DUTY VEHICLE / AD-001 ASPALT DISTRIBUTOR': 'AĞIR TONAJLI ARAÇ / ASFALT DAĞITICI'
};
</script>
<script>
/* Günlük Bakım — Daily Maintenance Tracker
   Sayfa mantığı: Bugün / Geçmiş / Ekipmanlar / Ayarlar
   Veri: localStorage, dille TR/EN */
(function () {
  'use strict';

  const OILS = ['15W-40', '68', 'ACX30', 'ACX50', '80W-90', '85W-90', 'ATF DIII', 'COOL ELF', '85W-140'];
  const STORE = 'gunlukBakim.v1';
  const EN_MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

  /* ================= yardımcılar ================= */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad = n => String(n).padStart(2, '0');
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const parseISO = iso => { const p = String(iso).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); };
  const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 86400000);
  const addDays = (iso, n) => { const dt = new Date(parseISO(iso) + n * 86400000); return dt.getUTCFullYear() + '-' + pad(dt.getUTCMonth() + 1) + '-' + pad(dt.getUTCDate()); };
  const bi = (trStr, enStr) => (state.lang === 'en' ? enStr : trStr);

  function fmtDate(iso) {
    if (!iso) return '—';
    const p = iso.split('-');
    return state.lang === 'en' ? EN_MONTHS[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0] : p[2] + '.' + p[1] + '.' + p[0];
  }
  function fmtShort(iso) { const p = iso.split('-'); return state.lang === 'en' ? (+p[1]) + '/' + (+p[2]) : p[2] + '.' + p[1]; }
  function t(key, vars) {
    const dict = window.I18N[state.lang] || window.I18N.tr;
    let s = dict[key];
    if (s == null) s = window.I18N.tr[key] || key;
    if (vars) for (const k in vars) s = s.split('{' + k + '}').join(String(vars[k]));
    return s;
  }
  function tType(raw) { if (!raw) return ''; return state.lang === 'tr' ? (window.TYPE_TR[raw] || raw) : raw; }

  /* ================= durum ================= */
  let state = null;
  const cache = { status: null, saveTimer: null, savedTimer: null, toastTimer: null };
  const ui = {
    page: 'today',
    date: todayISO(),
    search: '', type: '', onlyMissing: false,
    histView: 'days', histFrom: '', histTo: '', histSearch: '',
    eqSearch: '', eqType: '',
    alertsExpanded: false,
    refocus: null
  };

  function seedEquipment() {
    return (window.EQUIPMENT_SEED || []).map(e => ({ id: e.n, n: e.n, t: e.t, b: e.b, m: e.m, s: e.s }));
  }
  function defaultState() {
    return { lang: 'tr', settings: { warnDays: 2 }, equipment: seedEquipment(), removed: [], records: {} };
  }
  function load() {
    try {
      const raw = localStorage.getItem(STORE);
      if (raw) {
        const st = JSON.parse(raw);
        if (st && Array.isArray(st.equipment)) {
          st.settings = Object.assign({ warnDays: 2 }, st.settings || {});
          st.removed = Array.isArray(st.removed) ? st.removed : [];
          st.records = st.records && typeof st.records === 'object' ? st.records : {};
          st.lang = st.lang === 'en' ? 'en' : 'tr';
          return st;
        }
      }
    } catch (e) { /* bozuk kayıt -> sıfırdan */ }
    return defaultState();
  }
  function prune() {
    for (const d in state.records) {
      const r = state.records[d];
      if (!r || typeof r !== 'object') { delete state.records[d]; continue; }
      r.items = r.items || {};
      for (const id in r.items) {
        const it = r.items[id];
        const has = it.v || it.g || it.af || (it.o && Object.keys(it.o).length) || it.h || it.loc || it.ob;
        if (!has) delete r.items[id];
      }
      if (!r.attender && !Object.keys(r.items).length && (r.shift === 'day' || !r.shift)) delete state.records[d];
    }
  }
  function save(now) {
    clearTimeout(cache.saveTimer);
    cache.status = null; /* durum anında tazelensin (KPI/uyarılar) */
    const doSave = () => {
      prune();
      try {
        localStorage.setItem(STORE, JSON.stringify(state));
        flashSaved();
      } catch (e) {
        toast(bi('Kayıt alanı doldu! Eski kayıtları CSV ile indirip temizleyin.', 'Storage full! Export CSV and clean old records.'), 'err', 4200);
      }
    };
    if (now) doSave(); else cache.saveTimer = setTimeout(doSave, 400);
  }
  function flashSaved() {
    const el = $('#savedNote');
    if (!el) return;
    el.classList.add('show');
    clearTimeout(cache.savedTimer);
    cache.savedTimer = setTimeout(() => el.classList.remove('show'), 1400);
  }
  function toast(msg, kind, ms) {
    const el = $('#toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(cache.toastTimer);
    cache.toastTimer = setTimeout(() => el.classList.remove('show'), ms || 2200);
  }

  function getRecord(d, create) {
    if (!state.records[d]) {
      if (!create) return null;
      state.records[d] = { attender: '', shift: 'day', items: {} };
    }
    const r = state.records[d];
    r.items = r.items || {};
    return r;
  }
  function getItem(d, id, create) {
    const r = getRecord(d, create);
    if (!r) return null;
    if (!r.items[id]) {
      if (!create) return null;
      r.items[id] = { v: 0, g: 0, af: 0, o: {}, h: '', loc: '', ob: '' };
    }
    const it = r.items[id];
    it.o = it.o || {};
    return it;
  }

  /* ================= durum hesapları ================= */
  function computeStatuses() {
    const recs = state.records;
    const dates = Object.keys(recs).sort();
    const last = {};
    let firstVisit = null;
    for (const d of dates) {
      const items = (recs[d] && recs[d].items) || {};
      let any = false;
      for (const id in items) { if (items[id].v) { last[id] = d; any = true; } }
      if (any && !firstVisit) firstVisit = d;
    }
    const today = todayISO();
    const warnDays = Math.max(1, parseInt(state.settings.warnDays, 10) || 2);
    const out = { last: last, byEq: {}, warnCount: 0, firstVisit: firstVisit };
    for (const eq of state.equipment) {
      const l = last[eq.id] || null;
      let missed = 0, st;
      if (l) {
        missed = Math.max(0, diffDays(l, today));
        st = missed >= warnDays ? 'warn' : (missed === 0 ? 'today' : (missed === 1 ? 'pending' : 'ok'));
      } else {
        const start = (eq.createdAt && firstVisit && eq.createdAt > firstVisit) ? eq.createdAt : firstVisit;
        if (start) { missed = Math.max(0, diffDays(start, today) + 1); st = missed >= warnDays ? 'warn' : 'never'; }
        else { missed = 0; st = 'never'; }
      }
      out.byEq[eq.id] = { last: l, missed: missed, st: st };
      if (st === 'warn') out.warnCount++;
    }
    return out;
  }
  function statuses() { if (!cache.status) cache.status = computeStatuses(); return cache.status; }

  function statusChip(s) {
    if (s.st === 'today') return '<span class="chip ok">✓ ' + esc(t('okChip')) + '</span>';
    if (s.st === 'warn') return '<span class="chip danger">⚠ ' + esc(t('warnChip', { n: s.missed })) + '</span>';
    if (s.st === 'pending') return '<span class="chip warn">' + esc(t('pendingChip')) + '</span>';
    if (s.st === 'ok') return '<span class="chip warn">' + esc(t('gapDays', { n: s.missed })) + '</span>';
    return '<span class="chip neutral">' + esc(t('never')) + '</span>';
  }

  function visitsOn(d) {
    const r = state.records[d];
    if (!r) return 0;
    let n = 0;
    for (const id in r.items) if (r.items[id].v) n++;
    return n;
  }

  /* ================= filtreler ================= */
  function eqMatches(eq, q) {
    if (!q) return true;
    q = q.toLowerCase();
    return (eq.n + ' ' + eq.t + ' ' + (eq.b || '') + ' ' + (eq.m || '')).toLowerCase().indexOf(q) !== -1;
  }
  function todayFilterList() {
    const st = statuses();
    return state.equipment.filter(eq => {
      if (ui.type && eq.t !== ui.type) return false;
      if (!eqMatches(eq, ui.search)) return false;
      if (ui.onlyMissing) {
        const it = getItem(ui.date, eq.id, false);
        if (it && it.v) return false;
      }
      return true;
    });
  }

  /* ================= sayfa: bugün ================= */
  function renderToday() {
    const list = todayFilterList();
    const total = state.equipment.length;
    const types = allTypes();
    const rec = getRecord(ui.date, false);
    const isToday = ui.date === todayISO();

    const html = `
      <h1 class="page-title">${esc(t('navToday'))} — ${esc(fmtDate(ui.date))}</h1>
      <p class="page-sub">${esc(t('appSub'))}</p>

      <div class="toolbar">
        <div class="date-nav">
          <button class="btn sm" data-act="date-prev" title="${esc(t('prevDay'))}">‹</button>
          <input class="input" type="date" id="datePick" value="${esc(ui.date)}" max="${todayISO()}">
          <button class="btn sm" data-act="date-next" title="${esc(t('nextDay'))}" ${isToday ? 'disabled' : ''}>›</button>
          <button class="btn sm" data-act="date-today" ${isToday ? 'disabled' : ''}>${esc(t('today'))}</button>
        </div>
        <div class="field">
          <label>${esc(t('attender'))}</label>
          <input class="input" type="text" id="attenderInput" placeholder="${esc(t('attenderPh'))}" value="${esc(rec ? rec.attender : '')}">
        </div>
        <div class="field">
          <label>${esc(t('shift'))}</label>
          <select class="input" id="shiftSelect">
            <option value="day" ${!rec || rec.shift !== 'night' ? 'selected' : ''}>${esc(t('shiftDay'))}</option>
            <option value="night" ${rec && rec.shift === 'night' ? 'selected' : ''}>${esc(t('shiftNight'))}</option>
          </select>
        </div>
        <span class="saved-note" id="savedNote">✔ ${esc(t('saved'))}</span>
        <div class="spacer"></div>
        <button class="btn sm" data-act="mark-all">${esc(t('markAll'))}</button>
        <button class="btn sm" data-act="unmark-all">${esc(t('unmarkAll'))}</button>
        <label class="check-inline"><input type="checkbox" class="cb" id="onlyMissing" ${ui.onlyMissing ? 'checked' : ''}> ${esc(t('onlyMissing'))}</label>
        <div class="field">
          <label>${esc(t('search'))}</label>
          <input class="input" type="search" id="todaySearch" placeholder="${esc(t('searchPh'))}" value="${esc(ui.search)}" style="min-width:230px">
        </div>
        <div class="field">
          <label>${esc(t('type'))}</label>
          <select class="input" id="todayType">
            <option value="">${esc(t('allTypes'))}</option>
            ${types.map(x => `<option value="${esc(x)}" ${ui.type === x ? 'selected' : ''}>${esc(tType(x))}</option>`).join('')}
          </select>
        </div>
      </div>

      <div class="kpis" id="kpis"></div>
      <div id="alerts"></div>

      <div class="card" style="padding:0;overflow:hidden">
        <div style="padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)">
          <h2 style="margin:0">${esc(t('navToday'))} <span class="count" id="showingCount"></span></h2>
          <span class="hint">${esc(t('noRecordsYet'))}</span>
        </div>
        <div id="todayTable"></div>
      </div>`;

    $('#main').innerHTML = html;
    renderTodayTable();
    updateTodayStats();
  }

  function renderTodayTable() {
    const list = todayFilterList();
    const total = state.equipment.length;
    const show = $('#showingCount');
    if (show) show.textContent = t('showing', { a: list.length, b: total });

    if (!list.length) {
      $('#todayTable').innerHTML = '<div class="empty"><span class="big">🔍</span>' + esc(t('noneFound')) + '</div>';
      return;
    }
    const head = `
      <thead><tr>
        <th class="c-chk" title="${esc(t('visited'))}">✓</th>
        <th class="c-no">${esc(t('equipmentNo'))}</th>
        <th class="c-type">${esc(t('type'))}</th>
        <th class="c-bm">${esc(t('brand'))} / ${esc(t('model'))}</th>
        <th>${esc(t('hours'))}</th>
        <th>${esc(t('location'))}</th>
        <th class="o-col" title="${esc(t('greasing'))}">GRS</th>
        <th class="o-col" title="${esc(t('airFilter'))}">AIR</th>
        ${OILS.map(o => `<th class="o-col">${esc(o)}</th>`).join('')}
        <th class="obs">${esc(t('observation'))}</th>
      </tr></thead>`;

    const rows = list.map(eq => {
      const it = getItem(ui.date, eq.id, false) || { v: 0, g: 0, af: 0, o: {}, h: '', loc: '', ob: '' };
      const oils = it.o || {};
      return `
      <tr data-row="${esc(eq.id)}" class="${it.v ? 'visited' : ''}">
        <td class="c-chk"><input type="checkbox" class="cb big" data-f="v" data-id="${esc(eq.id)}" ${it.v ? 'checked' : ''}></td>
        <td class="c-no" title="${esc(eq.n)}">${esc(eq.n)}</td>
        <td class="c-type" title="${esc(eq.t)}">${esc(tType(eq.t))}<small>${esc(eq.s || '')}</small></td>
        <td class="c-bm" title="${esc((eq.b || '') + ' ' + (eq.m || ''))}"><b>${esc(eq.b || '—')}</b><small>${esc(eq.m || '')}</small></td>
        <td><input type="text" data-f="h" data-id="${esc(eq.id)}" value="${esc(it.h)}" placeholder="${esc(t('hours'))}" style="width:86px"></td>
        <td><input type="text" data-f="loc" data-id="${esc(eq.id)}" value="${esc(it.loc)}" placeholder="${esc(t('locationPh'))}" style="min-width:110px"></td>
        <td class="o-col"><input type="checkbox" class="cb" data-f="g" data-id="${esc(eq.id)}" ${it.g ? 'checked' : ''}></td>
        <td class="o-col"><input type="checkbox" class="cb" data-f="af" data-id="${esc(eq.id)}" ${it.af ? 'checked' : ''}></td>
        ${OILS.map(o => {
          const ov = oils[o];
          const qty = (ov && typeof ov === 'object') ? (ov.q || '') : '';
          return `<td class="o-col"><span class="oil-cell">
            <input type="checkbox" class="cb" data-f="oil" data-oil="${esc(o)}" data-id="${esc(eq.id)}" ${ov ? 'checked' : ''}>
            <input type="number" class="oil-qty" data-f="oilq" data-oil="${esc(o)}" data-id="${esc(eq.id)}" value="${esc(qty)}" min="0" step="0.5" placeholder="${esc(t('oilQtyShort'))}" title="${esc(o)} — ${esc(t('oilQtyTitle'))}">
          </span></td>`;
        }).join('')}
        <td class="obs"><input type="text" data-f="ob" data-id="${esc(eq.id)}" value="${esc(it.ob)}" placeholder="${esc(t('observationPh'))}"></td>
      </tr>`;
    }).join('');

    $('#todayTable').innerHTML = `<div class="table-wrap"><table class="grid">${head}<tbody>${rows}</tbody></table></div>`;
  }

  function kpiBlock(cls, label, value, note) {
    return `<div class="kpi ${cls}"><div class="k-label">${esc(label)}</div><div class="k-value">${value}</div><div class="k-note">${esc(note)}</div></div>`;
  }

  function updateTodayStats() {
    const st = statuses();
    const today = todayISO();
    const warnDays = Math.max(1, parseInt(state.settings.warnDays, 10) || 2);
    const total = state.equipment.length;
    let visited = 0, warn = 0;
    for (const eq of state.equipment) {
      const s = st.byEq[eq.id];
      if (s.st === 'today') visited++;
      if (s.st === 'warn') warn++;
    }
    const yv = visitsOn(addDays(today, -1));
    const pct = total ? Math.round(visited / total * 100) : 0;

    const kpis = $('#kpis');
    if (kpis) {
      kpis.innerHTML =
        kpiBlock('ok', t('kpiVisited'), `${visited} <span style="font-size:14px;color:var(--muted)">/ ${total}</span>`, t('kpiVisitedNote', { n: total })) +
        `<div class="kpi info"><div class="k-label">${esc(t('kpiProgress'))}</div><div class="k-value">${pct}%</div><div class="progress"><i style="width:${pct}%"></i></div></div>` +
        kpiBlock('warn', t('kpiPending'), total - visited, t('kpiPendingNote')) +
        kpiBlock('danger', t('kpiWarnings'), warn, t('kpiWarningsNote', { n: warnDays })) +
        kpiBlock('info', t('kpiLastDay'), yv, t('kpiLastDayNote'));
    }

    const alertsBox = $('#alerts');
    if (alertsBox) {
      if (!warn) {
        alertsBox.innerHTML = `<div class="card" style="border-color:#bbf7d0;background:#f7fef9"><h2 style="color:var(--ok)">✔ ${esc(t('alertsEmpty'))}</h2></div>`;
      } else {
        const list = state.equipment
          .filter(eq => st.byEq[eq.id].st === 'warn')
          .sort((a, b) => st.byEq[b.id].missed - st.byEq[a.id].missed);
        const cap = ui.alertsExpanded ? list.length : 12;
        const shown = list.slice(0, cap);
        const rest = list.length - shown.length;
        alertsBox.innerHTML = `
          <div class="card alerts">
            <h2>${esc(t('alertsTitleN', { n: warn, d: warnDays }))}</h2>
            <div class="alert-list">
              ${shown.map(eq => {
                const s = st.byEq[eq.id];
                return `<div class="alert-item" data-act="jump" data-no="${esc(eq.n)}" title="${esc(t('jumpTo'))}">
                  <span class="a-no">${esc(eq.n)}</span>
                  <span class="a-type">${esc(tType(eq.t))}</span>
                  <span class="a-last">${esc(t('lastMaintenance'))}: ${s.last ? esc(fmtDate(s.last)) : '—'}</span>
                  <span class="a-days">⚠ ${esc(t('warnChip', { n: s.missed }))}</span>
                </div>`;
              }).join('')}
            </div>
            ${list.length > 12 ? `<div style="text-align:center;margin-top:10px">
              <button class="btn sm" data-act="alerts-toggle">${rest > 0 ? esc(t('alertsMore', { n: rest })) : esc(t('alertsLess'))}</button>
            </div>` : ''}
          </div>`;
      }
    }

    const badge = $('#navBadge');
    if (badge) {
      badge.textContent = warn;
      badge.style.display = warn ? '' : 'none';
    }
  }

  function allTypes() {
    const set = {};
    state.equipment.forEach(e => { if (e.t) set[e.t] = 1; });
    return Object.keys(set).sort((a, b) => a.localeCompare(b));
  }

  function focusRow(id) {

  function renderChart() {
    const box = $('#chart');
    if (!box) return;
    const today = todayISO();
    const days = [];
    for (let i = 13; i >= 0; i--) days.push(addDays(today, -i));
    const counts = days.map(d => visitsOn(d));
    const max = Math.max(1, ...counts);
    box.innerHTML = days.map((d, i) => {
      const c = counts[i];
      const h = Math.round(c / max * 100);
      return `<div class="bar ${c ? '' : 'zero'}" title="${esc(fmtDate(d))}: ${c}">
        <span>${c || ''}</span>
        <i style="height:${Math.max(3, h)}%"></i>

      </div>`;
    }).join('');
  }

  function histFilteredDates() {
    return Object.keys(state.records).sort().reverse().filter(d => {
      if (ui.histFrom && d < ui.histFrom) return false;
      if (ui.histTo && d > ui.histTo) return false;
      if (ui.histSearch) {
        const r = state.records[d];
        const q = ui.histSearch.toLowerCase();
        const attenderHit = (r.attender || '').toLowerCase().indexOf(q) !== -1;
        const eqHit = Object.keys(r.items).some(id => {
          const eq = eqById(id);
          return eqMatches({ n: id, t: eq ? eq.t : '', b: eq ? eq.b : '', m: eq ? eq.m : '' }, q);
        });
        if (!attenderHit && !eqHit) return false;
      }
      return true;
    });
  }

  function eqById(id) { return state.equipment.find(e => e.id === id) || null; }

  function itemDoneChips(it) {
    const chips = [];
    if (it.g) chips.push('<span class="chip ok">GRS</span>');
    if (it.af) chips.push('<span class="chip ok">AIR</span>');
    Object.keys(it.o || {}).forEach(o => {
      const v = it.o[o];
      if (!v) return;
      const q = (typeof v === 'object') ? v.q : '';
      chips.push('<span class="chip oil">' + esc(o) + (q ? ' · ' + esc(q) + ' L' : '') + '</span>');
    });
    if (!chips.length && it.v) chips.push('<span class="chip neutral">' + esc(t('visited')) + '</span>');
    if (!chips.length) chips.push('<span class="chip neutral">' + esc(t('noVisit')) + '</span>');
    return chips.join(' ');
  }

  /* ================= modal ================= */
  function openModal(opts) {
    closeModal();
    const back = document.createElement('div');
    back.className = 'modal-backdrop';
    back.id = 'modalRoot';
    back.innerHTML = `
      <div class="modal" role="dialog">
        <div class="m-head">${opts.title}</div>
        <div class="m-body">${opts.body}</div>
        <div class="m-foot">
          <button class="btn" data-modal="cancel">${esc(t('cancel'))}</button>
          ${opts.okLabel ? `<button class="btn ${opts.danger ? 'danger' : 'primary'}" data-modal="ok">${esc(opts.okLabel)}</button>` : ''}
        </div>
      </div>`;
    document.body.appendChild(back);
    back.addEventListener('click', e => {
      if (e.target === back) closeModal();
      const b = e.target.closest('[data-modal]');
      if (!b) return;
      if (b.dataset.modal === 'cancel') closeModal();
      if (b.dataset.modal === 'ok' && opts.onOk) {
        const res = opts.onOk(back);
        if (res !== false) closeModal();
      }
    });
    const first = back.querySelector('input,select,textarea');
    if (first) setTimeout(() => first.focus(), 60);
    return back;
  }
  function closeModal() { const m = document.getElementById('modalRoot'); if (m) m.remove(); }
  function modalErr(back, msg) { const e = back.querySelector('.err'); if (e) e.textContent = msg || ''; }

  /* ================= dışa aktarma ================= */
  function downloadBlob(blob, name) {
    const a = document.createElement('a');
    const url = URL.createObjectURL(blob);
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  }

  function exportCsv() {
    const sep = ';';
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const head = [t('date'), t('attender'), t('shift'), t('equipmentNo'), t('type'), t('brand'), t('model'), t('visited'), t('greasing'), t('airFilter'), t('oils'), t('hours'), t('location'), t('observation')];
    const lines = [head.map(q).join(sep)];
    const dates = histFilteredDates().slice().sort();
    for (const d of dates) {
      const r = state.records[d];
      for (const id of Object.keys(r.items).sort()) {
        const it = r.items[id];
        const eq = eqById(id);
        lines.push([
          d, r.attender || '', r.shift === 'night' ? t('shiftNight') : t('shiftDay'),
          id, eq ? eq.t : '', eq ? eq.b : '', eq ? eq.m : '',
          it.v ? '✔' : '', it.g ? '✔' : '', it.af ? '✔' : '',
          Object.keys(it.o || {}).filter(k => it.o[k]).map(k => {
            const v = it.o[k];
            const q = (v && typeof v === 'object') ? v.q : '';
            return q ? k + ': ' + q + ' L' : k;
          }).join(' / '),
          it.h || '', it.loc || '', it.ob || ''
        ].map(q).join(sep));
      }
    }
    const blob = new Blob(['\ufeff' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    downloadBlob(blob, 'gunluk-bakim_' + todayISO() + '.csv');
    toast(t('downloaded'), 'ok');
  }

  function backupJson() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    downloadBlob(blob, 'gunluk-bakim-yedek_' + todayISO() + '.json');
    toast(t('downloaded'), 'ok');
  }

  function restoreJson() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.addEventListener('change', () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const st = JSON.parse(rd.result);
          if (!st || !Array.isArray(st.equipment)) throw new Error('bad');
          st.settings = Object.assign({ warnDays: 2 }, st.settings || {});
          st.removed = Array.isArray(st.removed) ? st.removed : [];
          st.records = st.records && typeof st.records === 'object' ? st.records : {};
          st.lang = st.lang === 'en' ? 'en' : state.lang;
          state = st;
          save(true);
          render();
          toast(t('restoreDone'), 'ok');
        } catch (e) {
          toast(t('restoreErr'), 'err');
        }
      };
      rd.onerror = () => toast(t('restoreErr'), 'err');
      rd.readAsText(f);
    });
    inp.click();
  }

  }

  function refreshRow(id) {
    const tr = $(`tr[data-row="${CSS.escape(id)}"]`);
    if (!tr) return;
    const it = getItem(ui.date, id, false);
    tr.classList.toggle('visited', !!(it && it.v));
  }

  /* ================= olaylar ================= */
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el) return;
    const act = el.dataset.act;

    switch (act) {
      case 'nav':
        ui.page = el.dataset.page;
        ui.refocus = null;
        render();
        window.scrollTo({ top: 0 });
        break;

      case 'lang':
        state.lang = el.dataset.lang === 'en' ? 'en' : 'tr';
        save(true);
        render();
        break;

      case 'date-prev':
        ui.date = addDays(ui.date, -1);
        renderToday();
        break;
      case 'date-next':
        if (ui.date < todayISO()) { ui.date = addDays(ui.date, 1); renderToday(); }
        break;
      case 'date-today':
        ui.date = todayISO();
        renderToday();
        break;

      case 'mark-all': {
        const list = todayFilterList();
        list.forEach(eq => { getItem(ui.date, eq.id, true).v = 1; });
        save(true);
        renderTodayTable();
        updateTodayStats();
        break;
      }
      case 'unmark-all': {
        const list = todayFilterList();
        list.forEach(eq => { const it = getItem(ui.date, eq.id, false); if (it) it.v = 0; });
        save(true);
        renderTodayTable();
        updateTodayStats();
        break;
      }

      case 'jump': {
        ui.search = el.dataset.no;
        ui.type = '';
        ui.onlyMissing = false;
        ui.page = 'today';
        render();
        setTimeout(() => focusRow(el.dataset.no), 80);
        break;
      }

      case 'hist-view':
        ui.histView = el.dataset.view;
        renderHistory();
        break;

      case 'alerts-toggle':
        ui.alertsExpanded = !ui.alertsExpanded;
        updateTodayStats();
        break;

      case 'export-csv': exportCsv(); break;
      case 'backup': backupJson(); break;
      case 'restore': restoreJson(); break;

      case 'add-eq': openAddEquipment(); break;
      case 'del-eq': confirmDeleteEquipment(el.dataset.no); break;

      case 'reset-seed': {
        openModal({
          title: esc(t('resetSeed')),
          body: `<p>${esc(t('resetSeedDesc'))}</p>`,
          okLabel: t('confirm'),
          onOk: () => {
            let added = 0;
            (window.EQUIPMENT_SEED || []).forEach(e => {
              if (state.removed.indexOf(e.n) !== -1) return;
              if (state.equipment.some(x => x.id === e.n)) return;
              state.equipment.push({ id: e.n, n: e.n, t: e.t, b: e.b, m: e.m, s: e.s });
              added++;
            });
            save(true);
            closeModal();
            toast(t('resetSeedDone') + ' (+' + added + ')', 'ok');
            render();
            return true;
          }
        });
        break;
      }

      case 'clear-records': {
        openModal({
          title: esc(t('clearRecords')),
          body: `<p>${esc(t('clearConfirm'))}</p>`,
          okLabel: t('del'),
          danger: true,
          onOk: () => {
            state.records = {};
            save(true);
            closeModal();
            toast(t('cleared'), 'ok');
            render();
            return true;
          }
        });
        break;
      }
    }
  });

  /* checkbox / select / date değişimleri */
  document.addEventListener('change', e => {
    const el = e.target;

    if (el.id === 'datePick') {
      ui.date = el.value || todayISO();
      if (ui.date > todayISO()) ui.date = todayISO();
      renderToday();
      return;
    }
    if (el.id === 'attenderInput') return; /* input event handles */
    if (el.id === 'shiftSelect') {
      const r = getRecord(ui.date, true);
      r.shift = el.value;
      save(true);
      return;
    }
    if (el.id === 'onlyMissing') { ui.onlyMissing = el.checked; renderTodayTable(); return; }
    if (el.id === 'todayType') { ui.type = el.value; renderTodayTable(); return; }
    if (el.id === 'eqType') { ui.eqType = el.value; renderEqTable(); return; }
    if (el.id === 'warnDays') {
      state.settings.warnDays = Math.min(30, Math.max(1, parseInt(el.value, 10) || 2));
      el.value = state.settings.warnDays;
      save(true);
      renderChrome();
      return;
    }
    if (el.id === 'histFrom') { ui.histFrom = el.value; renderHistList(); return; }
    if (el.id === 'histTo') { ui.histTo = el.value; renderHistList(); return; }

    const f = el.dataset && el.dataset.f;
    if (!f) return;
    const id = el.dataset.id;
    if (f === 'oil') {
      const it = getItem(ui.date, id, true);
      if (el.checked) { it.o[el.dataset.oil] = 1; it.v = 1; }
      else delete it.o[el.dataset.oil];
      const vCb = $(`tr[data-row="${CSS.escape(id)}"] [data-f="v"]`);
      if (vCb) vCb.checked = !!it.v;
      afterItemChange(id);
      return;
    }
    if (f === 'v' || f === 'g' || f === 'af') {
      const it = getItem(ui.date, id, true);
      it[f] = el.checked ? 1 : 0;
      if ((f === 'g' || f === 'af') && el.checked && !it.v) {
        it.v = 1;
        const vCb = $(`tr[data-row="${CSS.escape(id)}"] [data-f="v"]`);
        if (vCb) vCb.checked = true;
      }
      afterItemChange(id);
      return;
    }
  });

  function afterItemChange(id) {
    refreshRow(id);
    updateTodayStats();
    save();
  }

  /* metin girdileri */
  document.addEventListener('input', e => {
    const el = e.target;

    if (el.id === 'attenderInput') {
      const v = el.value;
      if (v.trim()) { const r = getRecord(ui.date, true); r.attender = v; save(); }
      else { const r = getRecord(ui.date, false); if (r) { r.attender = ''; save(); } }
      return;
    }
    if (el.id === 'todaySearch') { ui.search = el.value; ui.refocus = 'todaySearch'; renderTodayTable(); return; }
    if (el.id === 'eqSearch') { ui.eqSearch = el.value; ui.refocus = 'eqSearch'; renderEqTable(); return; }
    if (el.id === 'histSearch') {
      ui.histSearch = el.value;
      ui.refocus = 'histSearch';
      renderHistList();
      return;
    }

    const f = el.dataset && el.dataset.f;
    if (!f || f === 'v' || f === 'g' || f === 'af' || f === 'oil') return;
    const id = el.dataset.id;
    const it = getItem(ui.date, id, true);

    if (f === 'oilq') {
      /* yağ miktarı (litre): değer girilince yağ "kullanıldı" olur */
      const name = el.dataset.oil;
      const raw = el.value.trim();
      if (raw === '') {
        if (it.o[name]) it.o[name] = 1;
      } else {
        it.o[name] = { u: 1, q: raw };
        it.v = 1;
      }
      const oilCb = $(`tr[data-row="${CSS.escape(id)}"] [data-f="oil"][data-oil="${name}"]`);
      if (oilCb) oilCb.checked = !!it.o[name];
      const vCb = $(`tr[data-row="${CSS.escape(id)}"] [data-f="v"]`);
      if (vCb) vCb.checked = !!it.v;
      afterItemChange(id);
      return;
    }

    it[f] = el.value;
    save();
  });

  /* kısayollar */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeModal();
  });

  /* ================= başlat ================= */
  function boot() {
    state = load();
    ui.date = todayISO();
    render();
  }
  boot();
})();
</script>
</body>
</html>
